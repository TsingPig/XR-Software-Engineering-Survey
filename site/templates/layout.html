<!doctype html>
<html lang="$html_lang">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fafafa">
  <title>$page_title</title>
  <meta name="description" content="$description">
  <link rel="canonical" href="$canonical">
  <link rel="alternate" hreflang="en" href="$english_url">
  <link rel="alternate" hreflang="zh-CN" href="$chinese_url">
  <link rel="alternate" hreflang="x-default" href="$english_url">
  <meta property="og:type" content="website">
  <meta property="og:title" content="$page_title">
  <meta property="og:description" content="$description">
  <meta property="og:url" content="$canonical">
  <meta property="og:image" content="$social_image">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 80 80'%3E%3Crect width='80' height='80' rx='20' fill='%231d1d1f'/%3E%3Ctext x='40' y='52' text-anchor='middle' font-family='Arial,sans-serif' font-size='38' font-weight='700' fill='white'%3EXR%3C/text%3E%3C/svg%3E">
  <link rel="preload" href="$base/assets/inter-variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="$base/assets/style.css">
  <script defer src="$base/assets/app.js"></script>
  <script type="application/ld+json">$structured_data</script>
</head>
<body data-lang="$lang">
  <a class="skip-link" href="#main">$skip_label</a>
  $header
  <main id="main">$content</main>
  $footer
</body>
</html>
